<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOO · 磁盘管理</title>
  <meta name="description" content="YOO 图片托管 - 磁盘管理与文件浏览" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@1.37.0/dist/umd/lucide.min.js"
          integrity="sha384-Q+SBuMPu2+Rlj/ENVdxcp5LNmVj4xEw5M3/6aY4Uf0yd4NQSO/OyjkvdzTnDCxpr"
          crossorigin="anonymous" defer></script>
  <style>
    .disk-grid {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr));
      gap:28px; max-width:100%; margin:40px auto 0;
    }
    .disk-card {
      border:2px solid var(--border); border-radius:16px;
      padding:36px; cursor:pointer;
      transition:border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      background:var(--surface); text-decoration:none; color:inherit;
      display:block;
    }
    .disk-card:hover {
      border-color:var(--brand); transform:translateY(-3px);
      box-shadow:0 8px 24px rgba(0,0,0,0.08);
    }
    .disk-card-head {
      display:flex; align-items:center; gap:14px; margin-bottom:16px;
    }
    .disk-icon {
      width:52px; height:52px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.5rem;
    }
    .disk-icon.blob { background:rgba(64,158,255,0.12); color:#409EFF; }
    .disk-icon.s3 { background:rgba(167,139,250,0.12); color:#a78bfa; }
    .disk-name { font-weight:700; font-size:1.15rem; }
    .disk-sub { font-size:0.8rem; color:var(--muted); margin-top:2px; }
    .disk-stats {
      display:flex; gap:20px; font-size:0.85rem; color:var(--muted);
      padding-top:14px; border-top:1px solid var(--border);
    }
    .disk-stats strong { color:var(--text); font-size:1.2rem; display:block; margin-bottom:2px; }
    .disk-arrow {
      margin-left:auto; color:var(--muted); transition:transform 0.15s, color 0.15s;
    }
    .disk-card:hover .disk-arrow { transform:translateX(4px); color:var(--brand); }
    @media (max-width:600px) {
      .disk-grid { grid-template-columns:1fr; gap:14px; }
      .disk-card { padding:20px; }
      .disk-icon { width:44px; height:44px; font-size:1.2rem; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="./index.html" class="brand" style="text-decoration:none;">
        <svg class="wordmark wordmark-nav" viewBox="0 0 124 44" role="img" aria-label="YOO">
          <g class="g-y"><path class="stroke wm-y" pathLength="1" d="M7 7Q13 17 21 24M35 7Q29 17 21 24M21 24V37"/></g>
          <g class="g-o1"><circle class="stroke wm-o1" pathLength="1" cx="60" cy="22" r="15.5"/></g>
          <g class="g-o2"><path class="stroke wm-o2" pathLength="1" d="M113.7 13.11A15.5 15.5 0 1 1 102.35 6.56"/><circle class="wm-dot" cx="108.75" cy="8.58" r="3"/></g>
        </svg>
      </a>
      <nav class="nav">
        <a href="./index.html">
          <i data-lucide="home" class="icon-sm"></i>
          <span>主页</span>
        </a>
        <a href="./api.html">
          <i data-lucide="book-open" class="icon-sm"></i>
          <span>API 文档</span>
        </a>
        <a href="./photos.html">
          <i data-lucide="image" class="icon-sm"></i>
          <span>图库</span>
        </a>
        <a href="./gallery.html" class="active">
          <i data-lucide="hard-drive" class="icon-sm"></i>
          <span>磁盘管理</span>
        </a>
        <a href="./upload.html">
          <i data-lucide="settings" class="icon-sm"></i>
          <span>管理后台</span>
        </a>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换主题">
          <i data-lucide="moon" class="icon-moon icon-md"></i>
          <i data-lucide="sun" class="icon-sun icon-md"></i>
        </button>
      </nav>
    </div>
  </header>

  <div id="loginGate" class="container" style="padding:80px 20px;" hidden>
    <div class="card" style="max-width:400px;margin:0 auto;padding:32px;text-align:center;">
      <svg class="wordmark" viewBox="0 0 124 44" role="img" aria-label="YOO" style="width:76px;height:27px;margin-bottom:14px;">
        <g class="g-y"><path class="stroke wm-y" pathLength="1" d="M7 7Q13 17 21 24M35 7Q29 17 21 24M21 24V37"/></g>
        <g class="g-o1"><circle class="stroke wm-o1" pathLength="1" cx="60" cy="22" r="15.5"/></g>
        <g class="g-o2"><path class="stroke wm-o2" pathLength="1" d="M113.7 13.11A15.5 15.5 0 1 1 102.35 6.56"/><circle class="wm-dot" cx="108.75" cy="8.58" r="3"/></g>
      </svg>
      <h3 style="margin:0 0 18px;">磁盘管理</h3>
      <form id="loginForm" style="display:flex;flex-direction:column;gap:12px;">
        <input type="password" id="loginPassword" class="input" placeholder="输入访问密码"
               autocomplete="current-password" required style="text-align:center;" />
        <button class="button primary" type="submit" id="loginBtn" style="justify-content:center;">
          <i data-lucide="lock" class="icon-sm"></i>
          解锁
        </button>
        <p id="loginError" style="display:none;color:var(--danger);font-size:0.8rem;margin:0;"></p>
      </form>
    </div>
  </div>

  <main class="container-wide" id="galleryApp" hidden>
    <div style="text-align:center;margin-bottom:8px;">
      <h1 style="margin:0;font-size:1.6rem;display:flex;align-items:center;justify-content:center;gap:10px;">
        <i data-lucide="hard-drive" class="icon-md" style="color:var(--brand);"></i>
        磁盘管理
      </h1>
      <p style="color:var(--muted);font-size:0.85rem;margin-top:8px;">选择磁盘进入文件管理</p>
    </div>

    <div class="disk-grid" id="diskGrid">
      <a class="disk-card" href="./browser.html?storage=blob" data-storage="blob">
        <div class="disk-card-head">
          <div class="disk-icon blob"><i data-lucide="database" class="icon-lg"></i></div>
          <div>
            <div class="disk-name">腾讯盘</div>
            <div class="disk-sub">EdgeOne Blob</div>
          </div>
          <div class="disk-arrow"><i data-lucide="chevron-right" class="icon-md"></i></div>
        </div>
        <div class="disk-stats">
          <div><strong id="blobCount">-</strong>文件</div>
        </div>
      </a>
      <a class="disk-card" href="./browser.html?storage=s3" data-storage="s3">
        <div class="disk-card-head">
          <div class="disk-icon s3"><i data-lucide="cloud" class="icon-lg"></i></div>
          <div>
            <div class="disk-name">S3 盘</div>
            <div class="disk-sub">iDrive e2</div>
          </div>
          <div class="disk-arrow"><i data-lucide="chevron-right" class="icon-md"></i></div>
        </div>
        <div class="disk-stats">
          <div><strong id="s3Count">-</strong>文件</div>
        </div>
      </a>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <div>
            <span class="footer-brand-name">YOO · 磁盘管理</span>
            <span class="footer-brand-tag">腾讯盘 + S3 盘 · 边缘节点出图</span>
          </div>
        </div>
        <nav class="footer-links">
          <a href="./index.html"><i data-lucide="home" class="icon-xs"></i> 主页</a>
          <a href="./api.html"><i data-lucide="book-open" class="icon-xs"></i> API</a>
          <a href="./photos.html"><i data-lucide="image" class="icon-xs"></i> 图库</a>
          <a href="./gallery.html"><i data-lucide="hard-drive" class="icon-xs"></i> 磁盘</a>
          <a href="./upload.html"><i data-lucide="settings" class="icon-xs"></i> 管理</a>
        </nav>
      </div>
      <p class="footer-note">基于 EdgeOne Makers · 图片经 <code>/i/</code> 路由出图，删除后旧链接最多还会被边缘节点命中 1 小时</p>
    </div>
  </footer>

  <div id="toastContainer" class="toast-container"></div>
  <script src="./script.js"></script>
  <script>
    (function () {
      document.addEventListener('DOMContentLoaded', function () {
        initGate('galleryApp', function () {
          fetch(location.origin + '/api/list?limit=500&storage=blob')
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d && d.ok) document.getElementById('blobCount').textContent = d.total;
            }).catch(function () {});
          fetch(location.origin + '/api/list?limit=500&storage=s3')
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d && d.ok) document.getElementById('s3Count').textContent = d.total;
            }).catch(function () {});
        });
      });
    })();
  </script>
</body>
</html>
