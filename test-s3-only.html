<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 直传测试（纯浏览器）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #fff; }
    .section { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .section h2 { font-size: 1rem; margin-bottom: 12px; color: #4a9eff; }
    button { background: #4a9eff; color: #fff; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #3a8eef; }
    button:disabled { background: #555; cursor: not-allowed; }
    input[type="file"] { display: block; margin: 12px 0; padding: 8px; }
    pre { background: #0a0a0a; border: 1px solid #333; border-radius: 4px; padding: 12px; margin-top: 12px; overflow-x: auto; font-size: 0.85rem; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    label { display: block; margin: 8px 0 4px; font-size: 0.85rem; color: #999; }
    input[type="text"] { width: 100%; padding: 8px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-family: monospace; }
    .config-status { font-size: 0.85rem; padding: 8px; border-radius: 4px; margin-bottom: 12px; }
    .config-status.ok { background: rgba(74, 222, 128, 0.1); border: 1px solid #4ade80; color: #4ade80; }
    .config-status.fail { background: rgba(248, 113, 113, 0.1); border: 1px solid #f87171; color: #f87171; }
  </style>
</head>
<body>
  <h1>🧪 iDrive e2 S3 直传测试（纯浏览器）</h1>
  <p style="font-size: 0.85rem; color: #999; margin-bottom: 20px;">
    这个页面完全不依赖 EdgeOne 函数，直接在浏览器生成 S3 签名并上传。
  </p>

  <div class="section">
    <h2>1. S3 配置</h2>
    <div id="configStatus" class="config-status fail">请填写下方配置</div>
    <label>Endpoint (例如 https://s3.ap-northeast-1.idrivee2.com)</label>
    <input type="text" id="endpoint" value="https://s3.ap-northeast-1.idrivee2.com">
    <label>Region (例如 ap-northeast-1)</label>
    <input type="text" id="region" value="ap-northeast-1">
    <label>Bucket 名称</label>
    <input type="text" id="bucket" placeholder="yoo">
    <label>Access Key ID</label>
    <input type="text" id="accessKey" placeholder="你的 Access Key ID">
    <label>Secret Access Key</label>
    <input type="text" id="secretKey" placeholder="你的 Secret Access Key">
    <button onclick="saveConfig()">保存配置</button>
  </div>

  <div class="section">
    <h2>2. 上传文件</h2>
    <input type="file" id="fileInput">
    <button id="uploadBtn" onclick="uploadFile()" disabled>上传到 S3</button>
    <pre id="uploadResult">等待上传...</pre>
  </div>

  <div class="section">
    <h2>3. 列出文件</h2>
    <button id="listBtn" onclick="listFiles()" disabled>列出 Bucket 文件</button>
    <pre id="listResult">等待列出...</pre>
  </div>

  <script>
    // S3 SigV4 签名实现（纯浏览器，无依赖）
    const encoder = new TextEncoder();

    async function hmac(key, data) {
      const cryptoKey = await crypto.subtle.importKey(
        'raw', key, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
      );
      return crypto.subtle.sign('HMAC', cryptoKey, encoder.encode(data));
    }

    async function hash(data) {
      return crypto.subtle.digest('SHA-256', encoder.encode(data));
    }

    function hex(buf) {
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function ymd(d) {
      return d.toISOString().slice(0, 10).replace(/-/g, '');
    }

    function ymdhms(d) {
      return d.toISOString().slice(0, 19).replace(/[-:]/g, '') + 'Z';
    }

    async function getSigningKey(secretKey, date, region, service) {
      const kDate = await hmac(encoder.encode('AWS4' + secretKey), date);
      const kRegion = await hmac(kDate, region);
      const kService = await hmac(kRegion, service);
      return hmac(kService, 'aws4_request');
    }

    async function signRequest(method, url, headers, payloadHash, config) {
      const d = new Date();
      const date = ymd(d);
      const datetime = ymdhms(d);
      
      headers['x-amz-date'] = datetime;
      headers['x-amz-content-sha256'] = payloadHash;

      const urlObj = new URL(url);
      headers['host'] = urlObj.host;

      const signedHeaders = Object.keys(headers)
        .map(k => k.toLowerCase())
        .sort()
        .join(';');

      const canonicalHeaders = Object.keys(headers)
        .map(k => k.toLowerCase())
        .sort()
        .map(k => `${k}:${headers[Object.keys(headers).find(key => key.toLowerCase() === k)].trim()}`)
        .join('\n') + '\n';

      const canonicalUri = urlObj.pathname;
      const canonicalQuerystring = urlObj.search.slice(1);

      const canonicalRequest = [
        method,
        canonicalUri,
        canonicalQuerystring,
        canonicalHeaders,
        signedHeaders,
        payloadHash
      ].join('\n');

      const credentialScope = `${date}/${config.region}/s3/aws4_request`;
      const stringToSign = [
        'AWS4-HMAC-SHA256',
        datetime,
        credentialScope,
        hex(await hash(canonicalRequest))
      ].join('\n');

      const signingKey = await getSigningKey(config.secretKey, date, config.region, 's3');
      const signature = hex(await hmac(signingKey, stringToSign));

      return {
        ...headers,
        'Authorization': `AWS4-HMAC-SHA256 Credential=${config.accessKey}/${credentialScope}, SignedHeaders=${signedHeaders}, Signature=${signature}`
      };
    }

    async function presignUrl(method, url, config, expiresSeconds = 3600) {
      const d = new Date();
      const date = ymd(d);
      const datetime = ymdhms(d);
      const credentialScope = `${date}/${config.region}/s3/aws4_request`;
      const credential = `${config.accessKey}/${credentialScope}`;

      const urlObj = new URL(url);
      urlObj.searchParams.set('X-Amz-Algorithm', 'AWS4-HMAC-SHA256');
      urlObj.searchParams.set('X-Amz-Credential', credential);
      urlObj.searchParams.set('X-Amz-Date', datetime);
      urlObj.searchParams.set('X-Amz-Expires', expiresSeconds.toString());
      urlObj.searchParams.set('X-Amz-SignedHeaders', 'host');

      const canonicalUri = urlObj.pathname;
      // Canonical querystring: 按键排序，键值都要编码
      const canonicalQuerystring = Array.from(urlObj.searchParams.entries())
        .sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)
        .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
        .join('&');

      const canonicalRequest = [
        method,
        canonicalUri,
        canonicalQuerystring,
        `host:${urlObj.host}\n`,
        'host',
        'UNSIGNED-PAYLOAD'
      ].join('\n');

      const stringToSign = [
        'AWS4-HMAC-SHA256',
        datetime,
        credentialScope,
        hex(await hash(canonicalRequest))
      ].join('\n');

      const signingKey = await getSigningKey(config.secretKey, date, config.region, 's3');
      const signature = hex(await hmac(signingKey, stringToSign));

      urlObj.searchParams.set('X-Amz-Signature', signature);
      return urlObj.toString();
    }

    // 配置管理
    let s3Config = null;

    function saveConfig() {
      const config = {
        endpoint: document.getElementById('endpoint').value.trim(),
        region: document.getElementById('region').value.trim(),
        bucket: document.getElementById('bucket').value.trim(),
        accessKey: document.getElementById('accessKey').value.trim(),
        secretKey: document.getElementById('secretKey').value.trim()
      };

      if (!config.endpoint || !config.region || !config.bucket || !config.accessKey || !config.secretKey) {
        alert('请填写所有配置项');
        return;
      }

      s3Config = config;
      localStorage.setItem('s3Config', JSON.stringify(config));

      const status = document.getElementById('configStatus');
      status.textContent = '✓ 配置已保存';
      status.className = 'config-status ok';

      document.getElementById('uploadBtn').disabled = false;
      document.getElementById('listBtn').disabled = false;
    }

    function loadConfig() {
      const saved = localStorage.getItem('s3Config');
      if (saved) {
        const config = JSON.parse(saved);
        document.getElementById('endpoint').value = config.endpoint;
        document.getElementById('region').value = config.region;
        document.getElementById('bucket').value = config.bucket;
        document.getElementById('accessKey').value = config.accessKey;
        document.getElementById('secretKey').value = config.secretKey;
        s3Config = config;

        const status = document.getElementById('configStatus');
        status.textContent = '✓ 配置已加载';
        status.className = 'config-status ok';

        document.getElementById('uploadBtn').disabled = false;
        document.getElementById('listBtn').disabled = false;
      }
    }

    async function uploadFile() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) {
        alert('请先选择文件');
        return;
      }

      const result = document.getElementById('uploadResult');
      result.textContent = '正在生成签名 URL...';
      result.className = '';

      try {
        const rawKey = `${new Date().toISOString().slice(0, 10).replace(/-/g, '/')}/${Date.now()}-${file.name}`;
        const key = rawKey.split('/').map(encodeURIComponent).join('/');
        // Virtual-hosted 格式：bucket 在子域名，路径只有 key
        const url = `${s3Config.endpoint.replace('://', `://${s3Config.bucket}.`)}/${key}`;
        
        const signedUrl = await presignUrl('PUT', url, s3Config, 3600);
        result.textContent = `签名 URL 已生成，正在上传...\n${signedUrl.slice(0, 100)}...`;

        const response = await fetch(signedUrl, {
          method: 'PUT',
          body: file,
          headers: {
            'Content-Type': file.type || 'application/octet-stream'
          }
        });

        if (response.ok) {
          result.innerHTML = `<span class="success">✓ 上传成功！</span>\n\nKey: ${key}\nURL: ${url}\n大小: ${file.size} 字节`;
        } else {
          const text = await response.text();
          result.innerHTML = `<span class="error">✗ 上传失败 (${response.status})</span>\n\n${text}`;
        }
      } catch (err) {
        result.innerHTML = `<span class="error">✗ 错误</span>\n\n${err.message}\n${err.stack}`;
      }
    }

    async function listFiles() {
      const result = document.getElementById('listResult');
      result.textContent = '正在列出文件...';
      result.className = '';

      try {
        // Virtual-hosted 格式：bucket 在子域名
        const url = `${s3Config.endpoint.replace('://', `://${s3Config.bucket}.`)}?list-type=2&max-keys=10`;
        const headers = await signRequest('GET', url, {}, 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855', s3Config);

        const response = await fetch(url, { method: 'GET', headers });

        if (response.ok) {
          const text = await response.text();
          const parser = new DOMParser();
          const xml = parser.parseFromString(text, 'text/xml');
          const keys = Array.from(xml.querySelectorAll('Key')).map(k => k.textContent);
          
          if (keys.length === 0) {
            result.textContent = 'Bucket 为空';
          } else {
            result.textContent = `找到 ${keys.length} 个文件：\n\n${keys.join('\n')}`;
          }
        } else {
          const text = await response.text();
          result.innerHTML = `<span class="error">✗ 列出失败 (${response.status})</span>\n\n${text}`;
        }
      } catch (err) {
        result.innerHTML = `<span class="error">✗ 错误</span>\n\n${err.message}\n${err.stack}`;
      }
    }

    // 页面加载时恢复配置
    loadConfig();
  </script>
</body>
</html>
