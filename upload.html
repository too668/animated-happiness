<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>上传管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">E</span>
          <span>上传管理页</span>
        </div>
        <nav class="nav">
          <a href="./index.html">主页</a>
          <a href="./api.html">API 文档</a>
          <a href="./upload.html">上传页面</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="section">
        <h1>图片上传与管理</h1>

        <div class="panel upload-panel">
          <div class="row">
            <input id="apiEndpoint" type="text" value="https://yooy.cc.cd/api/upload" placeholder="接口地址" />
            <button id="refreshListBtn" class="secondary-btn" type="button">刷新列表</button>
          </div>

          <div class="row row-gap">
            <input id="uploadInput" type="file" accept="image/*" multiple />
            <button id="uploadBtn" type="button">上传图片</button>
          </div>

          <div class="row row-gap">
            <input id="searchInput" type="text" placeholder="搜索图片名" />
          </div>
        </div>

        <div class="panel">
          <h3>图片列表</h3>
          <div id="imageList" class="image-list"></div>
        </div>
      </section>
    </main>

    <footer>图片上传与管理页面</footer>

    <script src="./script.js"></script>
  </body>
</html>
