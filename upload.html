<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOO · 管理后台</title>
    <meta name="description" content="YOY 图片上传与管理后台，支持拖拽上传、批量操作、URL 复制。" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">Y</span>
          <span>YOO</span>
          <span class="badge success">● 在线</span>
        </div>
        <nav class="nav">
          <a href="./index.html">主页</a>
          <a href="./api.html">API 文档</a>
          <a href="./upload.html" class="active">管理后台</a>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换主题">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="section" style="padding-top:16px;">
        <h1 style="margin-bottom:24px;">图片管理</h1>

        <!-- Upload Area -->
        <div class="card" style="margin-bottom:24px;">
          <h3 style="margin-bottom:16px;">上传新图片</h3>
          
          <div class="upload-area" id="dropZone">
            <div class="icon">📁</div>
            <p><strong>拖拽图片到此处</strong> 或点击选择文件</p>
            <p style="font-size:0.82rem;margin-top:6px;">支持 PNG、JPG、GIF、WebP，可批量上传</p>
          </div>
          <input type="file" id="uploadInput" accept="image/*" multiple style="display:none;" />

          <div class="row row-gap" style="margin-top:16px;">
            <input id="apiEndpoint" type="text" value="https://yooy.cc.cd/api/upload" placeholder="API 接口地址" style="flex:1;" />
            <button id="refreshListBtn" class="secondary-btn" type="button">🔄 刷新</button>
          </div>
        </div>

        <!-- Search -->
        <div class="row" style="margin-bottom:16px;">
          <input id="searchInput" type="text" placeholder="🔍 搜索图片名称..." style="flex:1;max-width:400px;" />
          <span id="totalCount" class="badge" style="margin-left:auto;">0 张图片</span>
        </div>

        <!-- Image Grid -->
        <div class="card">
          <h3 style="margin-bottom:12px;">图片列表</h3>
          <div id="imageList" class="image-list"></div>
        </div>
      </section>
    </main>

    <footer>YOO · 图片上传与管理</footer>
    <div id="toastContainer" class="toast-container"></div>

    <script src="./script.js"></script>
  </body>
</html>
