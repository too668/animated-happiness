name: Deploy to EdgeOne Makers

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Deploy to EdgeOne
        run: |
          echo "Deploying to EdgeOne Makers..."
          echo "Note: EdgeOne will automatically pick up changes from your repository"
          echo "If you're using custom domain or advanced features, please check the EdgeOne console"
          
          # Simple verification that code exists
          ls -la edge-functions/
          cat edgefunctions.json
          
          # The actual deployment is handled by EdgeOne's webhook
          # This just verifies the build succeeds
          echo "Build verification complete!"
