name: Check Edge Functions

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 手动触发

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Syntax check edge functions
        run: |
          bunx --bun node --check "edge-functions/api/[[default]].js"
          bunx --bun node --check "edge-functions/i/[[default]].js"
          node --check script.js

      - name: Verify config
        run: |
          node -e "JSON.parse(require('fs').readFileSync('edgefunctions.json','utf8')); console.log('edgefunctions.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
