<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOO 极简测试</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; white-space: pre-wrap; }
        .success { color: green; }
        .error { color: red; }
        input[type="file"] { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 YOO 图床 API 测试</h1>
    
    <div>
        <h2>1. 认证测试</h2>
        <button onclick="testAuthStatus()">检查认证状态</button>
        <div id="authResult" class="result"></div>
    </div>

    <div>
        <h2>2. 上传测试</h2>
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="testUpload()">上传到 Blob</button>
        <button onclick="testUploadS3()">上传到 S3</button>
        <div id="uploadResult" class="result"></div>
    </div>

    <div>
        <h2>3. 列表测试</h2>
        <button onclick="testList()">获取图片列表</button>
        <div id="listResult" class="result"></div>
    </div>

    <div>
        <h2>4. 健康检查</h2>
        <button onclick="testHealth()">检查系统健康</button>
        <div id="healthResult" class="result"></div>
    </div>

    <script>
        const BASE_URL = 'https://yooy.cc.cd';

        async function apiCall(path, options = {}) {
            try {
                const response = await fetch(BASE_URL + path, options);
                const text = await response.text();
                return {
                    ok: response.ok,
                    status: response.status,
                    data: text ? JSON.parse(text) : null
                };
            } catch (error) {
                return { ok: false, error: error.message };
            }
        }

        function showResult(elementId, result) {
            const el = document.getElementById(elementId);
            el.className = 'result ' + (result.ok ? 'success' : 'error');
            el.textContent = JSON.stringify(result, null, 2);
        }

        async function testAuthStatus() {
            const result = await apiCall('/api/auth-status');
            showResult('authResult', result);
        }

        async function testUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                alert('请先选择一个图片文件');
                return;
            }

            // 先获取上传 URL
            const uploadRes = await apiCall('/api/upload-url?storage=blob', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    filename: file.name,
                    size: file.size,
                    contentType: file.type
                })
            });

            if (!uploadRes.ok || !uploadRes.data.uploadUrl) {
                showResult('uploadResult', uploadRes);
                return;
            }

            // 使用直传 URL 上传文件
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const directUploadRes = await fetch(uploadRes.data.uploadUrl, {
                    method: 'PUT',
                    body: file
                });

                const result = {
                    ...uploadRes.data,
                    uploadStatus: directUploadRes.status,
                    uploadSuccess: directUploadRes.ok
                };
                
                showResult('uploadResult', result);
            } catch (error) {
                showResult('uploadResult', { error: error.message });
            }
        }

        async function testUploadS3() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                alert('请先选择一个图片文件');
                return;
            }

            const uploadRes = await apiCall('/api/upload-url?storage=s3', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    filename: file.name,
                    size: file.size,
                    contentType: file.type
                })
            });

            showResult('uploadResult', uploadRes);
        }

        async function testList() {
            const result = await apiCall('/api/list?limit=10');
            showResult('listResult', result);
        }

        async function testHealth() {
            const result = await apiCall('/api/health');
            showResult('healthResult', result);
        }

        // 页面加载时自动测试一次
        window.addEventListener('load', () => {
            testAuthStatus();
        });
    </script>
</body>
</html>
